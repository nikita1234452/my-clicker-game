   <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King Kliker: Prestige World</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background: #0f172a; color: white; text-align: center; 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 70px; 
            touch-action: manipulation; overflow-x: hidden; user-select: none;
        }
        #header { background: #1e293b; padding: 15px; border-bottom: 3px solid #e91e63; position: sticky; top: 0; z-index: 1000; }
        #money { font-size: 34px; color: #f1c40f; font-weight: bold; }
        
        .tabs { display: flex; background: #1e293b; position: sticky; top: 95px; z-index: 999; }
        .tab { flex: 1; padding: 15px 5px; border: none; background: none; color: #94a3b8; font-size: 11px; font-weight: bold; }
        .tab.active { color: #fff; border-bottom: 3px solid #e91e63; }

        #game-zone { height: 260px; display: flex; justify-content: center; align-items: center; position: relative; }
        #coin-btn { font-size: 100px; background: none; border: none; cursor: pointer; transition: transform 0.05s; }
        #coin-btn:active { transform: scale(0.85); }

        .combo-text { position: absolute; top: 20px; right: 20px; color: #e91e63; font-size: 24px; font-weight: bold; opacity: 0; transition: 0.3s; }

        .section { display: none; padding: 15px; }
        .section.active { display: block; }
        .card { background: #1e293b; margin-bottom: 10px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .buy-btn { background: #e91e63; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; min-width: 90px; }
        .buy-btn.owned { background: #10b981 !important; }
        .locked { opacity: 0.3; filter: grayscale(1); }

        .fever-bg { height: 10px; background: #0f172a; width: 100%; margin-top: 10px; border-radius: 5px; overflow: hidden; }
        #fever-bar { height: 100%; background: linear-gradient(90deg, #ff9800, #ff5722); width: 0%; transition: width 0.1s linear; }

        .artifact-card { background: #1e293b; padding: 10px; border-radius: 10px; margin-top: 8px; border-left: 5px solid #e91e63; text-align: left; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

<div id="header">
    <div id="money">0</div>
    <div style="font-size:13px; color:#94a3b8;">💎 ПРЕСТИЖ: <span id="crys" style="color:#3498db;">0</span></div>
    <div class="fever-bg"><div id="fever-bar"></div></div>
</div>

<div class="tabs">
    <button class="tab active" onclick="sh('shop', this)">Магазин</button>
    <button class="tab" onclick="sh('skins', this)">Скины</button>
    <button class="tab" onclick="sh('case', this)">Кейсы</button>
    <button class="tab" onclick="sh('pres', this)">Престиж</button>
</div>

<div id="game-zone">
    <div id="combo" class="combo-text">COMBO X1</div>
    <button id="coin-btn" onmousedown="tap(event)" ontouchstart="tap(event)">🪙</button>
</div>

<div id="shop" class="section active">
    <div class="card"><div>Сила клика<br><small id="c1-txt">Цена: 10</small></div><button class="buy-btn" onclick="buy('p')">Lvl <span id="pl">1</span></button></div>
    <div class="card"><div>Авто-майнер<br><small id="c2-txt">Цена: 50</small></div><button class="buy-btn" onclick="buy('a')">Lvl <span id="al">0</span></button></div>
</div>

<div id="skins" class="section">
    <h4 style="color:#e91e63;">МАГАЗИН СУПЕР-СКИНОВ</h4>
    <div class="card"><div>💎 Алмаз (100к)</div><button class="buy-btn" id="b-💎" onclick="buyS('💎', 100000)">КУПИТЬ</button></div>
    <div class="card"><div>🔥 Огонь (500к)</div><button class="buy-btn" id="b-🔥" onclick="buyS('🔥', 500000)">КУПИТЬ</button></div>
    
    <h4 style="color:#f1c40f;">НАГРАДЫ ЗА ПРЕСТИЖ 💎</h4>
    <div id="prestige-skins-list"></div>
</div>

<div id="case" class="section">
    <div class="card" style="display:block;">
        <h3>📦 Эпический Кейс (5к)</h3>
        <button id="open-btn" class="buy-btn" style="width:100%; height:50px;" onclick="startCase()">ОТКРЫТЬ</button>
        <div id="art-list"></div>
    </div>
</div>

<div id="pres" class="section">
    <div class="card" style="display:block;">
        <h3>Престиж</h3>
        <p>Нужно: <span id="p-price" style="color:#f1c40f">10,000</span> монет</p>
        <button class="buy-btn" style="width:100%; height:50px;" onclick="doP()">ПОЛУЧИТЬ 💎</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    let m = Number(localStorage.getItem('m')) || 0;
    let p = Number(localStorage.getItem('p')) || 1;
    let c1 = Number(localStorage.getItem('c1')) || 10;
    let a = Number(localStorage.getItem('a')) || 0;
    let c2 = Number(localStorage.getItem('c2')) || 50;
    let cr = Number(localStorage.getItem('cr')) || 0;
    let skin = localStorage.getItem('skin') || '🪙';
    let owned = JSON.parse(localStorage.getItem('owned')) || ['🪙'];
    let artifacts = JSON.parse(localStorage.getItem('arts')) || [];
    
    let fScale = 0, isF = false, combo = 0, lastTap = 0;

    const pSkins = [
        {e:'🤖', r:1, n:'Робот'}, {e:'📺', r:2, n:'ТВ'}, {e:'🗄️', r:3, n:'Тумба'},
        {e:'🪑', r:4, n:'Стул'}, {e:'🎮', r:5, n:'Пульт'}, {e:'☎️', r:6, n:'Телефон'},
        {e:'🚪', r:7, n:'Дверь'}, {e:'🧱', r:8, n:'Стена'}, {e:'👑', r:9, n:'Король'}, {e:'🪐', r:10, n:'Космос'}
    ];

    function tap(e) {
        if (e) e.preventDefault();
        let now = Date.now();
        if(now - lastTap < 300) combo++; else combo = 1;
        lastTap = now;

        let inc = (p + artifacts.reduce((s, x) => s + x.b, 0)) * (1 + cr * 0.2);
        if(isF) inc *= 10;
        m += inc;
        
        fScale = Math.min(100, fScale + 2);
        if(fScale >= 100 && !isF) startF();
        
        showCombo();
        upd();
        tg.HapticFeedback.impactOccurred('light');
    }

    function showCombo() {
        const el = document.getElementById('combo');
        if(combo > 5) { el.style.opacity = 1; el.innerText = `COMBO X${combo}`; }
        else el.style.opacity = 0;
    }

    function upd() {
        document.getElementById('money').innerText = Math.floor(m).toLocaleString();
        document.getElementById('crys').innerText = cr;
        document.getElementById('pl').innerText = p;
        document.getElementById('al').innerText = a;
        document.getElementById('c1-txt').innerText = `Цена: ${c1}`;
        document.getElementById('c2-txt').innerText = `Цена: ${c2}`;
        document.getElementById('coin-btn').innerText = skin;
        document.getElementById('fever-bar').style.width = fScale + "%";
        document.getElementById('p-price').innerText = (10000 * (cr + 1)).toLocaleString();

        const pList = document.getElementById('prestige-skins-list');
        pList.innerHTML = '';
        pSkins.forEach(s => {
            let isLocked = cr < s.r;
            pList.innerHTML += `<div class="card ${isLocked?'locked':''}">
                <div>${s.e} ${s.n} (Пр. ${s.r})</div>
                <button class="buy-btn ${skin==s.e?'owned':''}" onclick="setS('${s.e}', ${s.r})">${skin==s.e?'ВЫБРАНО':'ВЫБРАТЬ'}</button>
            </div>`;
        });

        localStorage.setItem('m',m); localStorage.setItem('p',p); localStorage.setItem('cr',cr);
        localStorage.setItem('c1',c1); localStorage.setItem('c2',c2);
        localStorage.setItem('skin',skin); localStorage.setItem('owned', JSON.stringify(owned));
        localStorage.setItem('arts', JSON.stringify(artifacts));
    }

    function setS(s, req) { if(cr >= req) { skin = s; upd(); } }
    function buyS(s, cost) { if(owned.includes(s)) skin = s; else if(m >= cost) { m -= cost; owned.push(s); skin = s; } upd(); }
    function buy(t) {
        if(t=='p' && m >= c1) { m -= c1; p++; c1 = Math.round(c1*1.7); }
        if(t=='a' && m >= c2) { m -= c2; a++; c2 = Math.round(c2*1.8); }
        upd();
    }
    function startF() {
        isF = true;
        document.getElementById('coin-btn').style.filter = "drop-shadow(0 0 20px #ff9800)";
        let t = setInterval(() => { fScale -= 2; if(fScale <= 0) { isF = false; clearInterval(t); document.getElementById('coin-btn').style.filter = ""; upd(); } document.getElementById('fever-bar').style.width = fScale + "%"; }, 100);
    }
    function sh(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    }
    function doP() {
        let cost = 10000 * (cr + 1);
        if(m >= cost) { m=0; cr++; p=1; a=0; c1=10; c2=50; artifacts=[]; alert("ПРЕСТИЖ! +1 💎"); upd(); }
    }

    setInterval(() => { m += (a * (1 + cr * 0.2)) / 10; upd(); }, 100);
    upd();
</script>
</body>
</html>
