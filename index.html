                    <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>King Kliker: Artifacts Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #stats {
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #4ecca3;
        }

        #click-area {
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #click-area:active {
            transform: scale(0.95);
        }

        #main-button {
            width: 200px;
            height: 200px;
            background: linear-gradient(145deg, #4ecca3, #45b293);
            border-radius: 50%;
            border: 8px solid #ffffff22;
            box-shadow: 0 0 30px rgba(78, 204, 163, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .floating-text {
            position: absolute;
            color: #4ecca3;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        #shop {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }

        .item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .item.artifact {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        button {
            background: #4ecca3;
            border: none;
            color: #1a1a2e;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="stats">💰 <span id="balance">0</span></div>
    
    <div id="click-area" onclick="handleClick(event)">
        <div id="main-button">👑</div>
    </div>

    <div id="shop">
        <div class="item">
            <div>Улучшение Клика</div>
            <div id="click-cost">Цена: 10</div>
            <button onclick="buyUpgrade()">Купить</button>
        </div>
        <div class="item artifact">
            <div>🏺 Артефакт: Меч</div>
            <div>+5 за клик</div>
            <div id="art-cost">Цена: 100</div>
            <button id="art-btn" onclick="buyArtifact()">Взять</button>
        </div>
    </div>

    <script>
        let balance = 0;
        let clickPower = 1;
        let upgradeCost = 10;
        let artifactCost = 100;
        let hasArtifact = false;

        function updateDisplay() {
            document.getElementById('balance').innerText = Math.floor(balance);
            document.getElementById('click-cost').innerText = `Цена: ${upgradeCost}`;
            document.getElementById('art-cost').innerText = hasArtifact ? "Владеете" : `Цена: ${artifactCost}`;
            document.getElementById('art-btn').disabled = hasArtifact || balance < artifactCost;
        }

        function handleClick(event) {
            balance += clickPower;
            
            // Создание вылетающего текста
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = `+${clickPower}`;
            text.style.left = `${event.clientX - 20}px`;
            text.style.top = `${event.clientY - 40}px`;
            document.body.appendChild(text);
            
            setTimeout(() => text.remove(), 800);
            updateDisplay();
        }

        function buyUpgrade() {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.round(upgradeCost * 1.5);
                updateDisplay();
            }
        }

        function buyArtifact() {
            if (balance >= artifactCost && !hasArtifact) {
                balance -= artifactCost;
                clickPower += 5;
                hasArtifact = true;
                updateDisplay();
            }
        }

        updateDisplay();
    </script>
</body>
</html>
